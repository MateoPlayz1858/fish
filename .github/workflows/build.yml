name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 2.14.1 (needed by ForgeGradle 2.1)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 2.14.1

      - name: Build
        run: bash build.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RodMacro
          path: build/libs/*.jar
